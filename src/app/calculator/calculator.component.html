<style>
/* General form styles */
form {
  max-width: 700px;
  padding: 20px;
  margin: 15px auto;
  background-color: #f9f9f9;
  border: 1px solid #ddd;
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

/* Heading */
h2 {
  text-align: center;
  margin-top: 10px;
  margin-bottom: 20px;
  font-size: 28px;
  font-weight: bold;
  color: #0d4785;
}

/* Section Titles */
h3 {
  width: 95%;
  font-size: 20px;
  font-weight: bold;
  color: #333333;
  margin: 0px 0 0px;
}

/* Shape Image */
.shape-image-container {
  text-align: center;
  margin-bottom: 2px;
}

.shape-image-container img {
  max-width: 100%;
  height: auto;
  border: 2px solid #ccc;
  border-radius: 10px;
  padding: 5px;
}

/* Align fields in a single row */
.c-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: space-between;
  align-items: center;
}

/* Decrease field width */
.c-field {
  flex: 1;
  max-width: 22%; /* Adjust width for four fields in a row */
}

.c-field label {
  display: block;
  font-size: 14px;
  margin-bottom: 4px;
}

.c-field input {
  width: 100%;
  padding: 6px 10px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.c-field input:focus {
  border-color: #007bff;
  outline: none;
  box-shadow: 0 0 4px rgba(0, 123, 255, 0.5);
}

/* Adjust the area heading to appear inline with fields */
.area-heading {
  display: inline-block;
  font-weight: bold;
  font-size: 16px;
  margin-right: 10px;
}

/* Total Area */
#TotalArea , #TotalQuadArea , #calculatedArea {
  width: 100%;
  max-width: 100%;
  margin-top: 10px; /* Adjust the spacing */
  width: 97%;  
}

/* Increase width for specific Area fields */
#Area1, #Area2, #Area3 , #AreaT1 , #AreaT2 , #calculatedArea{
  width: 90%; /* Increase width to 90% */
  margin-top:20px;
  background-color: white;
}

/* Media query for larger screens */
@media (max-width: 768px) {
  .c-row {
    flex-wrap: wrap;
    gap: 10px;
  }

  .c-row .c-field {
    flex: 1 1 calc(33.33% - 10px); /* Three fields per row for sides */
    max-width: calc(33.33% - 10px);
  }

  .c-field input {
    width: 70%;
  }

  .c-row .c-field:last-child {
    flex: 1 1 100%; /* Area field spans the full width */
    max-width: 100%;
  }

  .area-heading {
    display: inline-block; /* Make Area1 heading visible beside fields */
    font-weight: bold;
    font-size: 16px;
    margin-right: 10px;
  }

  form {
    margin: 15px 10px;
    padding-top: 2px;
  }

  #Area1, #Area2, #Area3, #TotalArea , #AreaT1 , #AreaT2 , #TotalQuadArea , #calculatedArea{
  margin-top:0px;
  background-color: white;
  }

  #TotalArea , #TotalQuadArea , #calculatedArea {
    width: 90%;  
  }

  h2 {
  font-size: 22px;
  }
}

@media (max-width: 480px) {
  .c-row {
    flex-wrap: wrap;
    gap: 5px;
  }

  .c-row .c-field {
    flex: 1 1 calc(33.33% - 5px); /* Three fields per row for sides */
    max-width: calc(33.33% - 5px);
  }

  .c-row .c-field:last-child {
    flex: 1 1 100%; /* Area field spans the full width */
    max-width: 100%;
  }

  .area-heading {
    display: inline-block; /* Make Area1 heading visible beside fields */
    font-weight: bold;
    font-size: 14px;
    margin-right: 10px;
  }

  .c-field input {
    width: 70%;
  }

  #Area1, #Area2, #Area3, #TotalArea,  #AreaT1 , #AreaT2 , #TotalQuadArea , #calculatedArea {
  margin-top:0px;
  background-color: white;
 }

  #TotalArea {
    width: 90%;  
  }

  h2 {
  font-size: 20px;
  }
}

/* Row styling */
.row.g-4 {
  display: flex;
  flex-wrap: wrap;
  gap:1px;
  margin-bottom: 5px;
}

.c-col {
  flex: 1 1 calc(33.333% - 10px); /* Three columns per row */
  display: flex;
  flex-direction: column;
}

.c-col1 {
  text-align: center;
  flex: 1 1 calc(33.333% - 10px); /* Three columns per row */
  display: flex;
  flex-direction: column;
}

/* Field labels */
label {
  font-weight: bold;
  margin-bottom: 4px;
  color: #000000;
}

/* Form input fields */
input {
  padding: 10px 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 4px;
  width: 75%;
  transition: border-color 0.3s;
}

input:focus {
  border-color: #007bff;
  outline: none;
  box-shadow: 0 0 4px rgba(0, 123, 255, 0.5);
}


</style>

<form [formGroup]="simpleForm">
  <h2>Area Calculator for Triangle</h2>

   <!-- Shape Diagram -->
   <div class="shape-image-container">
    <img src="assets/3sides.png" alt="Shape Diagram" />
  </div>

  <div class="row g-4">
    <h3 class="area-heading">Triangle Area(Sqm)</h3>
    <div class="c-row">
      <div class="c-field">
        <label for="A1a">Side a (m):</label>
        <input formControlName="sideA" type="number" id="sideA" placeholder="a" />
      </div>
      <div class="c-field">
        <label for="A1b">Side b (m):</label>
        <input formControlName="sideB" type="number" id="sideB" placeholder="b" />
      </div>
      <div class="c-field">
        <label for="A1c">Side c (m):</label>
        <input formControlName="sideC" type="number" id="sideC" placeholder="c" />
      </div>
      <div class="c-field">
        <input
          formControlName="calculatedArea"
          type="text"
          id="calculatedArea"
          [value]="simpleForm.get('calculatedArea')?.value"
          [attr.disabled]="true"
        />
      </div>
    </div>
  </div>
  
  <!-- Total Area -->
  <div class="row g-4">
    <div class="c-col1">
      <label for="calculatedArea">Total Area (sqm):</label>
      <input
        formControlName="TotalArea"
        type="text"
        id="TotalArea"
        [value]="simpleForm.get('calculatedArea')?.value"
        [attr.disabled]="true"
      />
    </div>
  </div>
  

</form>
