<style>
  /* Contact Us Page Styling */
.contact-us {
  padding: 40px 20px;
  background-color: #f4f7fa; /* Light gray background */
  text-align: center;
}

.contact-us h2 {
  font-size: 36px;
  margin-bottom:30px;
  color: #993535;
  font-family: 'Roboto', sans-serif;
  font-weight: 700;
}

.location-card {
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #8cc3ff; /* Soft blue background for the card */
  color: #ffffff; /* White text color */
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  padding: 20px;
  max-width: 350px;
  height: 160px;
  margin: 0 auto;
  text-align: left;
}

.location-icon {
  margin-right: 15px;
  display: flex;
  align-items: center;
}

.location-icon svg {
  width: 40px;
  height: 40px;
  color: #6e6e6e; /* White color for icon */
}

.location-details {
  flex: 1;
}

.location-details h3 {
  font-size: 24px;
  margin-bottom: 10px;
  color: #000000;
}

.location-details p {
  font-size: 16px;
  color: #000000;
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
}

/* Quick Contact Section */
.quick-contact {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  background-color: #ffffff;
  gap: 40px; /* Adds space between image and form */
  margin: 0 auto;
  max-width: 1200px;
}

.view-map-link {
  display: block;
  font-size: 24px;
  color: #007bff; /* Blue color for the link */
  text-decoration: none;
  font-weight: bold;
  margin-bottom: 20px;
}

.view-map-link:hover {
  text-decoration: underline;
}

.contact-image {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.contact-photo {
  width: 600px;
  height: 550px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  object-fit: cover;
}

.contact-form {
  flex: 2;
  max-width: 500px;
  background-color: #ffffff;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  margin-left: 20px;
  margin-right: 20px;
  text-align: left;
  color: #333;
}

.contact-form h2 {
  font-size: 26px;
  margin-bottom: 20px;
  color: #153272;
  font-family:Arial, Helvetica, sans-serif;
  font-weight: bold;
}

.contact-form p {
  font-size: 18px;
  margin-bottom: 20px;
  color: #1d1d1d;
  font-family: 'Times New Roman', Times, serif;
}

.contact-form label {
  display: block;
  font-size: 14px;
  margin-bottom: 5px;
  color: #333;
  font-family: 'Arial', sans-serif;
}

.contact-form input, .contact-form textarea {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-family: 'Arial', sans-serif;
  box-sizing: border-box;
}

.contact-form input {
  border: 2px solid #696969;
}

.contact-form textarea {
  border: 2px solid #696969;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.contact-form button {
  background-color: #007bff;
  color: #fff;
  border: none;
  padding: 12px 15px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 16px;
  width: 100%;
  transition: background-color 0.3s ease;
}

.contact-form button:hover {
  background-color: #0056b3;
}

/* Responsive Design */
@media (max-width: 768px) {
  .quick-contact {
    flex-direction: column;
    text-align: center;
    gap: 20px;
  }

  .contact-image {
    width: 100%;
    margin-bottom: 20px;
  }

  .contact-photo {
    width: 100%;
    height: auto;
  }

  .contact-form {
    width: 100%;
    padding: 20px;
    margin-left: 0;
    margin-right: 0;
  }
}

    </style>

</div> -->

  <!-- Contact Us Page Section -->
<div class="contact-us">
    <h2>CONTACT US</h2>
    
    <!-- Location Card -->
    <div class="location-card">
      <div class="location-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C8.686 2 6 4.686 6 8c0 2.438 2.662 6.524 5.616 10.021a1 1 0 0 0 1.768 0C15.338 14.524 18 10.438 18 8c0-3.314-2.686-6-6-6zM12 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
        </svg>
      </div>
      <div class="location-details">
        <h3>Corporate Office</h3>
        <p>SV Lots , 2nd Floor , "Omkara" 5th Cross SIT Extension , Tumkur - 572102 </p>
      </div>
    </div>
  </div>

  <div class="quick-contact">
    <div class="contact-image">
      <a href="https://www.google.com/maps/place/Chirantana+Swadeshi+Bhandara/@13.3298158,77.1172572,116m/data=!3m1!1e3!4m6!3m5!1s0x3bb02d52692c261d:0x80608dcb87435cb4!
      8m2!3d13.3299037!4d77.1173911!16s%2Fg%2F11f34ll5h3?entry=ttu&g_ep=EgoyMDI0MDkxNi4wIKXMDSoASAFQAw%3D%3D" 
      target="_blank" class="view-map-link">View Map in larger view</a>
      <img src="assets/SV Lots map.PNG" alt="Contact Us" class="contact-photo">
    </div>

    <div class="contact-form">
      <h2>Quick Contact</h2>
      <p>We give you multiple reasons on why one should own a property at SV Lots</p>
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
        <label for="first-name">First Name *</label>
        <input type="text" id="first-name" formControlName="firstName" required>
    
        <label for="phone">Phone Number *</label>
        <input type="text" id="phone" formControlName="phone" required>
    
        <label for="email">Email Address *</label>
        <input type="email" id="email" formControlName="email" required>
    
        <label for="message">Message</label>
        <textarea id="message" formControlName="message" rows="4" maxlength="180" placeholder="Enter your message..." required></textarea>
    
        <button type="submit">Send Message</button>
      </form>
    </div>
    

  </div>
