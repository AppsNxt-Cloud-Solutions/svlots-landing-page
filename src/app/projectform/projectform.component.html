<style>
.project-form {
  max-width: 600px; /* Increased width */
  margin: 40px auto;
  padding: 30px;
  background-color: #e1effc; /* Soft background color */
  border-radius: 10px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
  font-family: Arial, sans-serif;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
  color: #333;
  font-size: 16px; /* Increased font size */
}

input,
textarea {
  width: 95%;
  padding: 12px;
  border: 1px solid #bbb;
  border-radius: 6px;
  font-size: 15px; /* Larger font for inputs */
  background-color: #fff;
}

input::placeholder,
textarea::placeholder {
  color: #888;
  font-size: 16px;
}

.submit-button {
  width: 100%;
  padding: 14px;
  background: linear-gradient(90deg, #0066cc, #3399ff); /* Gradient for a modern look */
  border: none;
  color: #fff;
  font-weight: bold;
  font-size: 18px;
  cursor: pointer;
  border-radius: 6px;
  box-shadow: 0px 5px 10px rgba(0, 102, 204, 0.4);
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
}

.submit-button:hover {
  background: linear-gradient(90deg, #00509e, #1a82e2); /* Darker gradient on hover */
  box-shadow: 0px 7px 12px rgba(0, 80, 158, 0.5);
}

.submit-button:active {
  transform: scale(0.98);
  box-shadow: 0px 3px 6px rgba(0, 102, 204, 0.3);
}

.project-form h2 {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 20px;
  text-align: center; 
  color:#00509e;
}


</style>


<form [formGroup]="addProjectForm" (ngSubmit)="submitProject()" class="project-form">
    <h2>Add New Project</h2>
    <div class="form-group">
      <label for="title">Project Title</label>
      <input id="title" formControlName="title" placeholder="Enter project title" required />
    </div>
  
    <div class="form-group">
        <label for="image">Upload Image</label>
        <input type="file" (change)="onFileSelected($event)" required />
    </div>
  
    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" placeholder="Enter project description" rows="3" required></textarea>
    </div>
  
    <div class="form-group">
      <label for="location">Location</label>
      <input id="location" formControlName="location" placeholder="Enter project location" required />
    </div>
  
    <div class="form-group">
      <label for="type">Type</label>
      <input id="type" formControlName="type" placeholder="Enter project type" required />
    </div>
  
    <div class="form-group">
      <label for="externalLink">Project Link</label>
      <input id="externalLink" formControlName="externalLink" placeholder="Enter Project link (Ex:https://euphoria.ison.me)" required />
    </div>
  
    <button type="submit" class="submit-button">Add Project</button>
  </form>
