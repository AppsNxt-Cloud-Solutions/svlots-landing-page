<style>

.light-green-section {
  background-color: rgb(236, 255, 232);

    margin: 2px 0; /* Space around the section */
}

.light-green-section button {
  background-color: rgb(236, 255, 232);
    color: rgb(0, 0, 0);
    padding: 10px 20px;

    .home-button {

  font-size: 16px;

  box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
}

/* Gallery Section Styling */
.gallery-section {
  padding: 60px 20px;
  background-color: #f9f9f9;
  text-align: center;
}

.gallery-section h2 {
  font-size: 36px;
  margin-bottom: 40px;
  color: #333;
}

.gallery-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.gallery-item {
  flex: 1;
  max-width: 350px; /* Adjusted to match new image size */
  margin: 0 15px;
  position: relative;
}

.gallery-photo {
  position: relative;
  overflow: hidden;
  border-radius: 15px; /* Rounded corners */
  width: 350px; /* Increased width by 50px */
  height: 250px; /* Increased height by 50px */
  transition: transform 0.3s ease-in-out;
  display: inline-block;
}

.gallery-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 15px;
}

/* Corner Border Styling */
.gallery-photo::before,
.gallery-photo::after {
  content: '';
  position: absolute;
  border: 3px solid black;
  width: 30px; /* Adjusted size for better visibility */
  height: 30px; /* Adjusted size for better visibility */
}

.gallery-photo::before {
  top: -5px; /* Offset the corner borders from the image */
  left: -5px;
  border-top-width: 3px;
  border-left-width: 3px;
  border-right: none;
  border-bottom: none;
}

.gallery-photo::after {
  bottom: -5px;
  right: -5px;
  border-bottom-width: 3px;
  border-right-width: 3px;
  border-left: none;
  border-top: none;
}

.gallery-photo:hover {
  transform: scale(1.05); /* Hover effect to enlarge the image */
}

.gallery-item p {
  font-size: 16px;
  color: #555;
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}

/* Responsive Design */
@media (max-width: 768px) {
  .gallery-row {
    flex-direction: column;
  }

  .gallery-item {
    max-width: 100%;
    margin-bottom: 20px;
  }

  .gallery-photo {
    width: 100%; /* Make photo responsive */
    height: auto;
  }
}
