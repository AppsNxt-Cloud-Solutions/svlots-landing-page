<style>


    .filter-sidebar {
      width: 250px;
      padding: 20px;
      border: 1px solid #ddd;
      background-color: #f0f0f0;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      height:600px;
    }
    .project-container {
      display: flex;
      flex-direction: row;
      gap: 50px;
      margin: 20px 20px;
      margin-right: 100px;
      margin-bottom: 50px;
    }
    
    .project-cards-container {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); /* Increase the minimum card size */
      gap: 40px; /* Increase the gap between cards */
      align-items: start;
      width: 100%;
    }
    
    .project-card {
      background-color: rgba(201, 190, 176, 0.3); /* Semi-transparent background */
      border-radius: 4px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      padding: 20px;
      height: 600px; /* Increased card height */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .project-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
    }
    
    .project-image {
      width: 100%;
      height: 300px; /* Increased height for images */  
      object-fit: fill;
      border-radius: 8px;
    }
    
    .project-info h3 {
      font-size: 28px; /* Increased font size */
      color: #1b5185;
      font-weight: bold;
      margin: 15px 0;
    }
    
    .project-info p {
      font-size: 18px; /* Increased font size */
      color: #252525;
      margin: 15px 0;
      text-align: justify;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      /* -webkit-line-clamp: 4; */
      -webkit-box-orient: vertical;
      font-family: Arial, Helvetica, sans-serif;
      padding:0 15px;
    }
    
    .project-info {
      flex: 1; /* Fills available space */
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    
    .project-info .location,
    .project-info .type {
      font-size: 14px;
      color: #555;
      margin: 5px 0;
      text-align: center;
    }
    
    .project-details p {
    padding-top: 1px;  /* Reduce the padding on top */
    padding-bottom: 8px;  /* Remove bottom padding to reduce space */
    margin: 0;  /* Optional: Reset margin if needed to decrease space around the elements */

    }

    .project-details {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 1px 0;  
    }

    .view-details {
      background-color: #1890ff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      font-size: 1.1rem;
      margin-top: auto; /* Pushes button to the bottom */
    }
    
    .view-details:hover {
      background-color: #106db1;
    }
    
    .heading-container {
      text-align: center;
      margin-bottom: 10px;
    }
    
    .heading-container h1 {
      font-size: 1.6rem;
      font-weight: bold;
      color: rgb(189, 154, 104);
      margin-top: 10px;
    }
    
    .heading-container p {
      font-size: 1.2rem;
      color: #686868;
      margin-top: 20px;
      font-family: 'Arial', sans-serif;
    }
    
    .filter-sidebar {
      width: 250px;
      padding: 20px;
      border: 1px solid #ddd;
      background-color: #f9f9f9;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-right: 20px;
    }
    
    .filter-sidebar h3 {
      font-size: 1.4rem;
      color: #946438;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .filter-group {
      margin-bottom: 20px;
    }
    
    .filter-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 1rem;
      color: #555;
    }
    
    .filter-group select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      background-color: #fff;
      color: #333;
      transition: all 0.3s;
      cursor: pointer;
    }
    
    .filter-group select:hover {
      border-color: #1890ff;
      box-shadow: 0 0 8px rgba(24, 144, 255, 0.2);
    }
    
    .filter-group select:focus {
      outline: none;
      border-color: #1890ff;
      box-shadow: 0 0 8px rgba(24, 144, 255, 0.3);
    }
    
    .filter-group select option {
      padding: 10px;
    }
    
    .filter-sidebar button {
      background-color: #1890ff;
      color: #fff;
      font-size: 1rem;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: background-color 0.3s;
    }
    
    .filter-sidebar button:hover {
      background-color: #106db1;
    }
    
    
    
    /* Media Queries for Responsiveness */
    @media screen and (max-width: 1200px) {
      .project-container {
        flex-direction: column;
        align-items: center;
        margin:10px;
      }
    
      .filter-sidebar {
        width: 90%;
        max-width: 300px;
        margin-right: 10px;
        margin-bottom: 20px;
        max-height:220px;
      }
    
      .project-cards-container {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
    
      .project-card {
        height: auto; /* Allow card height to adjust dynamically */
      }
    }
    
    @media screen and (max-width: 768px) {
      .project-container {
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin-right:10px;
      }
    
      .filter-sidebar {
        width: 100%;
        max-width: 90%;
        margin-right: 10px;
        margin-bottom: 20px;
        max-height:220px;
      }
    
      .project-cards-container {
        grid-template-columns: 1fr; /* Stacks cards vertically */
      }
    
      .project-card {
        height: auto; 
        width: 90%;
      }
    
      .view-details {
        font-size: 1rem; /* Adjust button size */
        padding: 10px 20px;
      }
    }
    
    @media screen and (max-width: 300px) {
      .heading-container h1 {
        font-size: 1.8rem; /* Smaller heading */
      }
    
      .heading-container p {
        font-size: 17px;
        text-align: justify;
        margin:15px;
      }
    
      .project-info h3 {
        font-size: 20px; /* Adjust title size */
      }
    
      .project-info p {
        font-size: 16px; /* Adjust paragraph size */
      }
    }

    .loading-spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #f3f3f3;
    border-top: 5px solid #3498db;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

    
    
    </style>
    
    
    <div class="heading-container">
      <h1>EXPERIENCE EXCELLENCE</h1>
      <p>Discover our visionary, innovative, and high-quality projects that are redefining real estate.</p>
    </div>
    
    <div class="project-container">
      <div class="filter-sidebar">
        <h3>Filter Projects</h3>
    
        <!-- Filter by Location -->
        <div class="filter-group">
          <label for="location">Location</label>
          <select [(ngModel)]="selectedLocation" (change)="applyFilters()">
            <option value="">All Locations</option>
            <option *ngFor="let location of uniqueLocations" [value]="location">{{ location }}</option>
          </select>
        </div>
    
        <!-- Filter by Property Type -->
        <div class="filter-group">
          <label for="type">Property Type</label>
          <select [(ngModel)]="selectedType" (change)="applyFilters()">
            <option value="">All Types</option>
            <option *ngFor="let type of uniqueTypes" [value]="type">{{ type }}</option>
          </select>
        </div>
      </div>

    <div class="project-cards-container">
      <div *ngFor="let project of filteredProjects" class="project-card">
        <!-- Loading Spinner -->
        <div *ngIf="project.loading" class="loading-spinner"></div>
    
        <!-- Project Image -->
        <img [src]="project.loading ? 'assets/placeholder.png' : project.imageUrl" alt="{{ project.title }}" class="project-image" 
             *ngIf="project.imageUrl || project.loading" (load)="onImageLoad(project)" />
    
        <ng-template #loadingTemplate>
          <div class="loading-spinner"></div>
        </ng-template>
    
        <div class="project-info">
          <h3>{{ project.title }}</h3>
          <div class="project-details">
            <p><i class="fas fa-map-marker-alt location-icon"></i> {{ project.location }}</p>
            <p><i class="fas fa-building property-icon"></i> {{ project.type }}</p>
          </div>
          <p>{{ project.description }}</p>
          <button class="view-details" (click)="viewMore(project.externalLink)">View More</button>
        </div>
      </div>
    </div>
